name: Faako Notebook Sync (controlled)

# Scoped source: GitHub verified merged PRs. No arbitrary PR text is published.
# Dry-run is the default. Writes require both the enable variable and token.
on:
  push:
    branches: [develop, main]
  pull_request:
    types: [closed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of an already-merged PR
        required: true
        type: number
      write:
        description: Request a write, if repo-wide sync is explicitly enabled
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

# Serializes journal upserts and component note appends. Retries are idempotent.
# GitHub may discard an older pending run; later reconciliation is still needed.
concurrency:
  group: faako-notebook-controlled-sync
  cancel-in-progress: false

jobs:
  merged-pr-journal:
    name: Verify and sync merged PR activity
    if: >-
      ${{ github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pr_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate sync rules and idempotency
        run: node --test scripts/notebook/*.test.mjs

      - name: GitHub-only impact preview
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            node scripts/notebook/sync-cli.mjs --commit "$GITHUB_SHA"
          else
            node scripts/notebook/sync-cli.mjs --pr "$PR_NUMBER"
          fi

      - name: Apply controlled Notion updates
        if: >-
          ${{ vars.FAAKO_NOTEBOOK_SYNC_ENABLED == 'true' &&
              (github.event_name == 'push' ||
               github.event_name == 'pull_request' ||
               (github.event_name == 'workflow_dispatch' && inputs.write == true)) }}
        env:
          FAAKO_NOTEBOOK_SYNC_ENABLED: "true"
          FAAKO_NOTEBOOK_NOTION_TOKEN: ${{ secrets.FAAKO_NOTEBOOK_NOTION_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            node scripts/notebook/sync-cli.mjs --commit "$GITHUB_SHA" --write
          else
            node scripts/notebook/sync-cli.mjs --pr "$PR_NUMBER" --write
          fi
