name: Monorepo CI

run-name: >
  Faako CI • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: faako-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-repository-hygiene.mjs

  detect-changes:
    name: Detect affected surfaces
    runs-on: ubuntu-latest
    outputs:
      javascript: ${{ steps.impact.outputs.javascript }}
      python: ${{ steps.impact.outputs.python }}
      faako_public: ${{ steps.impact.outputs.faako_public }}
      reebs_public: ${{ steps.impact.outputs.reebs_public }}
      dev_erp: ${{ steps.impact.outputs.dev_erp }}
      reebs_water: ${{ steps.impact.outputs.reebs_water }}
      twe: ${{ steps.impact.outputs.twe }}
      affected_apps: ${{ steps.impact.outputs.affected_apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify affected-app classifier
        run: node --test scripts/ci/*.test.mjs
      - name: Compute dependency-aware app impact
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/ci/affected-surfaces.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT" > affected-apps.json
          cat affected-apps.json >> "$GITHUB_STEP_SUMMARY"

  javascript-quality:
    name: Affected JavaScript quality gates
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.javascript == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install security scanner dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Build affected applications and packages
        run: pnpm exec turbo run build --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Run affected lint, type-check, and tests
        run: pnpm exec turbo run lint typecheck test --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Run repository security and registry gates
        run: |
          node --test scripts/hosting-policy.test.mjs
          pnpm security:all
          pnpm monitoring:check
          pnpm project-registry:check
          pnpm hosting:check

  python-tests:
    name: Shared Analytics quality gates
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/reebs-analytics/pyproject.toml

      - name: Install service test dependencies
        run: python -m pip install -e 'services/reebs-analytics[dev]'

      - name: Lint shared analytics service
        working-directory: services/reebs-analytics
        run: python -m ruff check app tests

      - name: Type-check shared analytics service
        working-directory: services/reebs-analytics
        run: python -m mypy app

      - name: Run shared analytics tests
        working-directory: services/reebs-analytics
        run: python -m pytest --disable-warnings

  public-browser-smoke:
    name: Public-site browser smoke
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.faako_public == 'true' || needs.detect-changes.outputs.reebs_public == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @faako/faako-website exec playwright install --with-deps chromium

      - name: Build and smoke-test Faako Website
        if: needs.detect-changes.outputs.faako_public == 'true'
        run: |
          pnpm --filter @faako/faako-website run build
          pnpm --filter @faako/faako-website exec astro preview --host 127.0.0.1 --port 4176 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4176/ >/dev/null && break; sleep 1; done
          pnpm --filter @faako/faako-website run test:e2e

      - name: Build and smoke-test REEBS Website
        if: needs.detect-changes.outputs.reebs_public == 'true'
        run: |
          pnpm --filter @faako/reebs-website run build
          pnpm --filter @faako/reebs-website exec astro preview --host 127.0.0.1 --port 4177 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4177/ >/dev/null && break; sleep 1; done
          REEBS_PREVIEW_URL=http://127.0.0.1:4177 pnpm --filter @faako/reebs-website run test:e2e

  reebs-water-browser:
    name: REEBS Water isolated browser regressions
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.reebs_water == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @faako/reebs-water exec playwright install --with-deps chromium
      - name: Run mocked Water browser suite (no deployed hosting required)
        run: pnpm --filter @faako/reebs-water run test:e2e
        env:
          NODE_ENV: test
          APP_ENV: development
          REEBS_SKIP_ENV_FILES: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reebs-water-browser-results
          path: apps/reebs-water/test-results/
          retention-days: 7

  dev-erp-browser:
    name: Dev ERP browser regressions
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.dev_erp == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @faako/dev-erp exec playwright install --with-deps chromium

      - name: Run non-production Dev ERP E2E suite
        run: pnpm --filter @faako/dev-erp run test:e2e

  required-checks:
    name: Required monorepo checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - repository-hygiene
      - detect-changes
      - javascript-quality
      - python-tests
      - public-browser-smoke
      - reebs-water-browser
      - dev-erp-browser
    steps:
      - name: Require every applicable quality gate
        env:
          REPOSITORY_HYGIENE: ${{ needs.repository-hygiene.result }}
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          JAVASCRIPT_QUALITY: ${{ needs.javascript-quality.result }}
          PYTHON_TESTS: ${{ needs.python-tests.result }}
          PUBLIC_BROWSER_SMOKE: ${{ needs.public-browser-smoke.result }}
          REEBS_WATER_BROWSER: ${{ needs.reebs-water-browser.result }}
          DEV_ERP_BROWSER: ${{ needs.dev-erp-browser.result }}
        run: |
          for result in \
            "$REPOSITORY_HYGIENE" \
            "$DETECT_CHANGES" \
            "$JAVASCRIPT_QUALITY" \
            "$PYTHON_TESTS" \
            "$PUBLIC_BROWSER_SMOKE" \
            "$REEBS_WATER_BROWSER" \
            "$DEV_ERP_BROWSER"
          do
            case "$result" in
              success|skipped) ;;
              *) echo "A required monorepo job did not pass: $result" >&2; exit 1 ;;
            esac
          done
