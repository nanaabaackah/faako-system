name: Travel With Ease foundation

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/travel-with-ease-*/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/travel-with-ease-foundation.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/travel-with-ease-*/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/travel-with-ease-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twe-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    # Playwright 1.58.2 cannot install Chromium dependencies on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: twe_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: twe_test_foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twe_test -d twe_test_foundation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@faako/travel-with-ease-*' run lint
      - run: pnpm --filter '@faako/travel-with-ease-*' run typecheck
      - run: pnpm --filter '@faako/travel-with-ease-*' run build
      - name: Verify existing Railway API can build the embedded CMS
        run: |
          APP_ENV=staging NODE_ENV=production pnpm --filter @faako/travel-with-ease-api railway:build
          test -f apps/travel-with-ease-api/dist/cms/index.html
          test -d apps/travel-with-ease-api/dist/cms/assets
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("apps/travel-with-ease-api/dist/cms/index.html", "utf8"); if (!html.includes("/assets/")) process.exit(1)'
      - run: pnpm --filter '@faako/travel-with-ease-*' run test
      - name: Shared tutorial component compatibility
        run: |
          pnpm --filter @faako/ui lint
          pnpm --filter @faako/ui typecheck
          pnpm --filter @faako/ui test
      - name: Guided workspace, content demo, website and email browser acceptance
        run: |
          pnpm --filter @faako/stroane-web exec playwright install --with-deps chromium
          pnpm --filter @faako/travel-with-ease-portal exec vite --host 127.0.0.1 --port 5197 > "$RUNNER_TEMP/twe-onboarding-vite.log" 2>&1 &
          node apps/travel-with-ease-portal/scripts/check-onboarding-browser.mjs
          node apps/travel-with-ease-portal/scripts/check-content-demo-browser.mjs
          node apps/travel-with-ease-web/scripts/check-public-followup.mjs
      - name: Retain synthetic design acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twe-content-email-demo-screenshots
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/twe-content-demo-*/*.png
            /tmp/twe-public-followup-*/*.png
      - name: Required isolated PostgreSQL integration tests
        run: pnpm --filter @faako/travel-with-ease-api run test:db
        env:
          APP_ENV: test
          # Synthetic credentials for the disposable job-local PostgreSQL service only.
          TWE_TEST_DATABASE_URL: postgresql://twe_test:isolated-ci-only@127.0.0.1:5432/twe_test_foundation # security-scan-ok
      - run: pnpm monitoring:check
      - run: pnpm project-registry:check
      - run: pnpm workspace:manifests
      - run: git diff --exit-code -- pnpm-lock.yaml

# Intentionally no deployment job, hosting secrets or production promotion.
# Protected staging delivery is a separate Prompt 03 gate, not implied by CI.
