name: Stroane CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/stroane-web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/stroane-ci.yml"

jobs:
  stroane-checks:
    name: Stroane Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @faako/stroane-web run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Validate Prisma schema
        run: pnpm --filter @faako/stroane-web exec prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm --filter @faako/stroane-web run lint

      - run: pnpm --filter @faako/stroane-web run test:backend

      - name: Build storefront
        run: pnpm --filter @faako/stroane-web run build
        env:
          VITE_APP_SURFACE: storefront
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          VITE_API_BASE_URL: https://api-staging.stroanesolutions.com/api
          VITE_BACKEND_BASE_URL: https://api-staging.stroanesolutions.com
          VITE_APP_ENV: staging

      - name: Build portal
        run: pnpm --filter @faako/stroane-web run build
        env:
          VITE_APP_SURFACE: portal
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          VITE_API_BASE_URL: https://api-staging.stroanesolutions.com/api
          VITE_BACKEND_BASE_URL: https://api-staging.stroanesolutions.com
          VITE_APP_ENV: staging