# Reebs website is a frontend-only site in production.
# It talks to the portal backend via VITE_BACKEND_BASE_URL / VITE_REEBS_PORTAL_URL.
[build]
command = "pnpm --filter @faako/reebs-website build"
publish = "/apps/reebs-website/dist"

[dev]
command = "pnpm --filter @faako/reebs-website dev -- --host 0.0.0.0 --port 5173"
targetPort = 5173
port = 8888
functions = "../reebs-portal/netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
