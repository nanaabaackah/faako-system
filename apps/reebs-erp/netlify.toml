[build]
command = "pnpm --filter @faako/reebs-erp build"
publish = "/apps/reebs-erp/dist"

[dev]
command = "pnpm --filter @faako/reebs-erp dev -- --host 0.0.0.0 --port 5173"
targetPort = 5173
port = 8888
functions = "netlify/functions"

[functions]
directory = "/apps/reebs-erp/netlify/functions"
node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
