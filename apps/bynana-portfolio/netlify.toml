[build]
  command = "pnpm --filter @faako/bynana-portfolio build"
  ignore = "node ./scripts/netlify-ignore.mjs @faako/bynana-portfolio"
  publish = "/apps/bynana-portfolio/dist"

[functions]
  directory = "/apps/bynana-portfolio/netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src 'self' https://www.figma.com; manifest-src 'self'; worker-src 'self' blob:"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact-submit"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact/"
  to = "/.netlify/functions/contact-submit"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/trust-stats"
  to = "/.netlify/functions/trust-stats-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/trust-stats/"
  to = "/.netlify/functions/trust-stats-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
