[build]
  command = "echo 'No build step for API'"
  publish = "/apps/faako-api/netlify/static"

[functions]
  directory = "/apps/faako-api/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg", "pg-pool", "pgpass", "pg-types", "pg-protocol", "pg-connection-string"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/:splat"
  status = 200
