[build]
  command = "pnpm --filter @faako/stroane-web build"
  ignore = "node ./scripts/netlify-ignore.mjs @faako/stroane-web"
  publish = "apps/stroane-web/dist"

[dev]
  command = "pnpm --filter @faako/stroane-web dev:frontend"
  targetPort = 5175
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://stroanesolutions.com; manifest-src 'self'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
