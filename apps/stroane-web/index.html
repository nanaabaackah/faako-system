<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" href="/assets/favicon_io/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon_io/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon_io/site.webmanifest" />

    <!-- Base SEO — overridden per page by useSEOMeta -->
    <title>Stroane | Food Safety Advisory & Compliance Ghana</title>
    <meta name="description" content="Stroane helps food businesses, manufacturers, and institutions in Ghana meet FDA standards, pass audits, and build safer operations." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Stroane" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="GH" />
    <meta name="geo.placename" content="Accra, Ghana" />

    <!-- Open Graph base -->
    <meta property="og:site_name" content="Stroane" />
    <meta property="og:locale" content="en_GH" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://stroanesolutions.com/assets/og-image.png" />

    <!-- Twitter Card base -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@stroane" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
