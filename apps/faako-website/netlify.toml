[build]
  command = "pnpm --filter @faako/faako-website build"
  ignore = "node ./scripts/netlify-ignore.mjs @faako/faako-website"
  publish = "/apps/faako-website/dist"

[functions]
  directory = "/apps/faako-website/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg", "pg-connection-string", "pg-int8", "pg-pool", "pg-protocol", "pg-types", "pgpass", "postgres-array", "postgres-bytea", "postgres-date", "postgres-interval", "split2", "xtend"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
