[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.33.0 --activate",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = ["pnpm --filter @faako/dev-erp run db:generate"]

[start]
cmd = "pnpm --filter @faako/dev-erp run server:with-migrate"
